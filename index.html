<style>
:root{color-scheme:light;--page:#f4f4f1;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--ring:rgba(11,11,11,0.12);--accent:#2a78d6;--bad:#b42a2a}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink-2:#c3c2b7;--ring:rgba(255,255,255,0.14);--accent:#3987e5;--bad:#e66767}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:28px 24px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-0.01em}
p{margin:0 0 20px;color:var(--ink-2);font-size:13px}
label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--ring);border-radius:9px;background:var(--page);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:10px;font-size:12px;color:var(--bad)}
.msg.wait{color:var(--muted)}
</style>
</head>

const KEY = 'nsd-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const form = document.getElementById('gate'), msg = document.getElementById('msg'), btn = document.getElementById('go'), input = document.getElementById('pw');
async function attempt(pw, remembered){
  btn.disabled = true; msg.className = 'msg wait'; msg.textContent = '여는 중…';
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    show(html);
  } catch (e) {
    try { sessionStorage.removeItem(KEY); } catch (e2) {}
    btn.disabled = false; msg.className = 'msg';
    msg.textContent = remembered ? '' : (window.crypto && crypto.subtle ? '비밀번호가 맞지 않습니다.' : '이 브라우저에서는 열 수 없습니다. 최신 크롬·사파리·엣지로 열어 주세요.');
    input.value = ''; input.focus();
  }
}
form.addEventListener('submit', e => { e.preventDefault(); if (input.value) attempt(input.value, false); });
let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
if (saved) attempt(saved, true);
</script>
